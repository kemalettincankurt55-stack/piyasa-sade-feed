name: Piyasa Sade — 30dk AI Ekonomi Haberleri & BIST Yükselen/Düşenler (CDN JSON)

on:
  schedule:
    # Her 30 dakikada bir otomatik çalışır (günde 48 kez — tamamen ücretsiz)
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-economy-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install requests

      - name: Saf Ekonomi Haberlerini Topla ve Tek Çağrıda AI Özetle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python piyasa_sade_engine/news_aggregator.py

      - name: BIST 100 Yükselen & Düşenler (1G/10G/20G/30G) Üret
        run: python piyasa_sade_engine/movers_aggregator.py

      - name: Güncel JSON akışlarını yayınla
        run: |
          git config user.name "Piyasa Sade Bot"
          git config user.email "bot@piyasasade.app"
          git add piyasa_sade_engine/output/economy_feed.json piyasa_sade_engine/output/movers_feed.json
          git diff --staged --quiet || (git commit -m "chore(feed): update AI news and BIST movers feed" && git push)
